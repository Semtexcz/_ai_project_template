schema_version: 2

# Tier 0 bootstrap: repository rules only. Startup must not duplicate this by
# manually reading architecture/workflow documentation before agent-context.
bootstrap:
  files:
    - AGENTS.md

# Tier 1 task context: exactly the selected task record.
task:
  files:
    - project/tasks/{task_id}-*.md

# Managed governance state for this template repository. Files that do not
# exist in the current project are skipped.
managed:
  files:
    - project/state.yaml
    - project/index.md
    - project/board.md
    - project/roadmap.md

# Explicit files are eagerly loaded candidates. Directories are search roots
# only; a directory entry is never recursively loaded into context.
project_type:
  template:
    files: []
    search_roots:
      - docs/
      - project/
      - tests/
      - template/
      - tools/

# Deterministic context budget. Task, selected skill, and bootstrap files are
# protected: generation fails loudly instead of silently dropping them.
budget:
  max_files: 20
  max_bytes: 120000

# Changed paths route to narrowly relevant explicit files and search roots.
change_patterns:
  ".agents/**":
    files:
      - .agents/README.md
    search_roots:
      - .agents/
  ".codex/**":
    files: []
    search_roots:
      - .codex/
  "docs/**":
    files: []
    search_roots:
      - docs/
  "template/**":
    files:
      - docs/template-development.md
    search_roots:
      - template/
      - tests/
  "tests/**":
    files: []
    search_roots:
      - tests/
  "project/**":
    files: []
    search_roots:
      - project/
  "Makefile":
    files:
      - Makefile
    search_roots: []
  "copier.yml":
    files:
      - copier.yml
    search_roots: []

# Focused validation recommendations per changed path. Make commands that do
# not exist in this repository are ignored by the resolver.
checks:
  ".agents/**":
    - make validate-agent-skills
  ".codex/**":
    - make validate-agent-skills
  "docs/**":
    - make validate-template-docs
  "AGENTS.md":
    - make validate-template-docs
  "README.md":
    - make validate-template-docs
  "CHANGELOG.md":
    - make validate-template-docs
  "UPGRADING.md":
    - make validate-template-docs
  "Makefile":
    - make validate-agent-skills
  "copier.yml":
    - make validate-template-docs
  "project/**":
    - make validate-project
  "template/**":
    - make check
  "tests/**":
    - make check
  "tools/**":
    - make check

exclude:
  - "**/.env"
  - "**/.env.*"
  - "**/*.pem"
  - "**/*.key"
  - "**/credentials*"
  - "**/secrets*"
  - "**/.git/**"
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/dist/**"
  - "**/.output/**"
  - "**/coverage/**"
  - "**/cache/**"
  - "**/.pytest_cache/**"
  - "**/.ruff_cache/**"
  - "**/__pycache__/**"
