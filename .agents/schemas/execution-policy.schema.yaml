schema_version: 1

# Declarative schema for .agents/execution.yaml (role-based execution policy).
# The canonical enforcement is `validate_policy` in template/tools/agent_execution.py;
# `make validate-agent-skills` cross-checks these declarations against the code so
# the two cannot drift. This is a small hand-written schema, matching the style of
# skill.schema.yaml and context-map.schema.yaml.

required:
  - schema_version
  - roles
  - profiles
allowed_keys: [schema_version, roles, profiles, policy, escalation, budgets]

roles:
  # Exactly the canonical roles: adding one is an architecture decision.
  enum: [planner, implementer, reviewer, fixer]
  required_keys: [profile]
  allowed_keys: [profile]
  profile: reference-to-profiles

profiles:
  required_keys: [harness, model, reasoning_effort, cost_class, capabilities]
  allowed_keys: [harness, model, reasoning_effort, cost_class, capabilities]
  harness: non-empty-string
  model: null-or-opaque-string
  reasoning_effort: [low, medium, high]
  cost_class: [cheap, efficient, high]
  capabilities: non-empty-list-of-strings

policy:
  allowed_keys: [max_implementation_attempts, max_review_cycles]
  positive-integers: [max_implementation_attempts, max_review_cycles]

escalation:
  triggers: [implementation_failure, architecture_failure, external_blocker]
  rules:
    implementation_failure:
      required_keys: [after_attempts, profile]
      allowed_keys: [after_attempts, profile]
      after_attempts: positive-integer
      profile: reference-to-profiles
    architecture_failure:
      required_keys: [role]
      allowed_keys: [role]
      role: reference-to-roles
    external_blocker:
      required_keys: [action]
      allowed_keys: [action]
      action: [human]

budgets:
  scopes: [task, session, campaign]
  entry_required_keys: [max_cost_usd]
  entry_allowed_keys: [max_cost_usd]
  max_cost_usd: null-or-positive-number
