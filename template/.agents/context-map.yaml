schema_version: 2

# Tier 0 bootstrap: repository rules only. Startup must not duplicate this by
# manually reading brief/architecture/workflow before agent-context.
bootstrap:
  files:
    - AGENTS.md

# Tier 1 task context: exactly the selected task record.
task:
  files:
    - project/tasks/{task_id}-*.md

# Managed governance state. Files that do not exist (for example in
# lightweight projects) are skipped.
managed:
  files:
    - project/state.yaml
    - project/index.md
    - project/board.md
    - project/roadmap.md

# Explicit files are eagerly loaded candidates. Directories are search roots
# only; a directory entry is never recursively loaded into context.
project_type:
  script:
    files:
      - pyproject.toml
    search_roots:
      - src/
      - tests/
  library:
    files:
      - pyproject.toml
    search_roots:
      - src/
      - tests/
  backend:
    files:
      - backend/pyproject.toml
      - backend/src/app/main.py
    search_roots:
      - backend/src/
      - backend/tests/
  frontend:
    files:
      - frontend/package.json
      - frontend/nuxt.config.ts
    search_roots:
      - frontend/pages/
      - frontend/tests/
  fullstack:
    files:
      - backend/pyproject.toml
      - backend/src/app/main.py
      - frontend/package.json
      - frontend/nuxt.config.ts
      - artifacts/openapi.json
    search_roots:
      - backend/src/
      - backend/tests/
      - frontend/pages/
      - frontend/tests/
      - frontend/shared/api/
  fullstack-production:
    files:
      - compose.yaml
    search_roots: []

# Deterministic context budget. Task, selected skill, and bootstrap files are
# protected: generation fails loudly instead of silently dropping them.
budget:
  max_files: 20
  max_bytes: 120000

# Changed paths route to narrowly relevant explicit files and search roots.
change_patterns:
  "src/**/*.py":
    files:
      - pyproject.toml
    search_roots:
      - src/
      - tests/
  "tests/**/*.py":
    files:
      - pyproject.toml
    search_roots:
      - src/
      - tests/
  "backend/**/*.py":
    files:
      - backend/pyproject.toml
    search_roots:
      - backend/src/
      - backend/tests/
  "frontend/**/*":
    files: []
    search_roots:
      - frontend/tests/
  "artifacts/openapi.json":
    files: []
    search_roots:
      - frontend/shared/api/
  "project/**":
    files: []
    search_roots:
      - project/
  ".agents/**":
    files:
      - .agents/README.md
    search_roots:
      - .agents/
  ".codex/**":
    files: []
    search_roots:
      - .codex/
  "**/Dockerfile":
    files: []
    search_roots: []
  "**/*.md":
    files: []
    search_roots:
      - docs/

# Focused validation recommendations per changed path. Make commands that do
# not exist in this repository are ignored by the resolver.
checks:
  "src/**/*.py":
    - make test
    - make typecheck
    - make lint
  "tests/**/*.py":
    - make test
  "backend/**/*.py":
    - make test
    - make typecheck
    - make lint
  "frontend/**/*":
    - make test
  "artifacts/openapi.json":
    - make api-check
  "docs/**":
    - make validate-docs
  "AGENTS.md":
    - make validate-docs
  "README.md":
    - make validate-docs
  "Makefile":
    - make validate-docs
    - make validate-agent-skills
  ".agents/**":
    - make validate-agent-skills
  ".codex/**":
    - make validate-agent-skills
  "**/Dockerfile":
    - make image-build

exclude:
  - "**/.env"
  - "**/.env.*"
  - "**/*.pem"
  - "**/*.key"
  - "**/credentials*"
  - "**/secrets*"
  - "**/.git/**"
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/dist/**"
  - "**/.output/**"
  - "**/coverage/**"
  - "**/cache/**"
  - "**/.pytest_cache/**"
  - "**/.ruff_cache/**"
  - "**/__pycache__/**"
