name: Template CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  require-pr-for-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require main commits to come from a pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          response="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${REPOSITORY}/commits/${SHA}/pulls")"
          count="$(python -c 'import json, sys; print(len(json.load(sys.stdin)))' <<< "${response}")"
          if [ "${count}" -eq 0 ]; then
            echo "Pushes to main must come from a GitHub pull request. Create a branch, push it, and open a ready PR instead."
            exit 1
          fi

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install Playwright browser
        run: npx --yes playwright@1.62.1 install --with-deps chromium
      - name: Static tests
        run: uv run pytest

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install Playwright browser
        run: npx --yes playwright@1.62.1 install --with-deps chromium
      - name: Run full release candidate gate
        run: make release-check

  render-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project_type: script
            runtime_level: local
            governance: lightweight
          - project_type: library
            runtime_level: shared
            governance: lightweight
          - project_type: backend
            runtime_level: shared
            governance: lightweight
          - project_type: frontend
            runtime_level: shared
            governance: lightweight
          - project_type: fullstack
            runtime_level: local
            governance: lightweight
          - project_type: fullstack
            runtime_level: production
            governance: lightweight
          - project_type: fullstack
            runtime_level: production
            governance: managed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Render profile
        run: |
          uvx copier copy . "/tmp/${{ matrix.project_type }}-${{ matrix.runtime_level }}-${{ matrix.governance }}" \
            --defaults \
            --data project_name="Generated App" \
            --data project_type="${{ matrix.project_type }}" \
            --data runtime_level="${{ matrix.runtime_level }}" \
            --data governance="${{ matrix.governance }}" \
            --data include_reference_feature=false \
            --trust --vcs-ref=HEAD
      - name: Validate generated project
        working-directory: /tmp/${{ matrix.project_type }}-${{ matrix.runtime_level }}-${{ matrix.governance }}
        run: |
          if [ "${{ matrix.governance }}" = "managed" ]; then
            python -m pip install pyyaml
            make sync-project-docs
            make validate-project
            make validate-agent-skills
          else
            make validate-docs
          fi

  script-local-golden-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Run script-local golden path
        run: uv run pytest tests/test_script_local_golden_path.py

  agent-one-task-workflow-golden-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Validate canonical agent skills
        run: make validate-agent-skills
      - name: Run agent one-task workflow golden path
        run: uv run pytest tests/test_agent_one_task_workflow_golden_path.py

  library-shared-golden-path:
