name: Template CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Static tests
        run: uv run pytest

  render-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project_type: script
            runtime_level: local
          - project_type: library
            runtime_level: shared
          - project_type: backend
            runtime_level: shared
          - project_type: frontend
            runtime_level: shared
          - project_type: fullstack
            runtime_level: local
          - project_type: fullstack
            runtime_level: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Render profile
        run: |
          uvx copier copy . "/tmp/${{ matrix.project_type }}-${{ matrix.runtime_level }}" \
            --defaults \
            --data project_name="Generated App" \
            --data project_type="${{ matrix.project_type }}" \
            --data runtime_level="${{ matrix.runtime_level }}" \
            --data include_reference_feature=false \
            --trust --vcs-ref=HEAD
      - name: Validate generated project
        working-directory: /tmp/${{ matrix.project_type }}-${{ matrix.runtime_level }}
        run: |
          python -m pip install pyyaml
          make sync-project-docs
          make validate-project

  script-local-golden-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Run script-local golden path
        run: uv run pytest tests/test_script_local_golden_path.py

  library-shared-golden-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Run library-shared golden path
        run: uv run pytest tests/test_library_shared_golden_path.py

  backend-shared-golden-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Run backend-shared golden path
        run: uv run pytest tests/test_backend_shared_golden_path.py

  frontend-shared-golden-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Run frontend-shared golden path
        run: uv run pytest tests/test_frontend_shared_golden_path.py

  fullstack-local-golden-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install Playwright browser
        run: npx --yes playwright@1.62.1 install --with-deps chromium
      - name: Run fullstack-local golden path
        run: uv run pytest tests/test_fullstack_local_golden_path.py

  fullstack-production-golden-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install Playwright browser
        run: npx --yes playwright@1.62.1 install --with-deps chromium
      - name: Run fullstack-production golden path
        run: uv run pytest tests/test_fullstack_production_golden_path.py

  project-state-validation-golden-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Run project state validation workflow
        run: uv run pytest tests/test_project_state_validation_golden_path.py
      - name: Verify maintainer project state
        run: |
          make sync-project-docs
          make validate-project
          git diff --exit-code -- README.md project/index.md project/board.md

  copier-update-golden-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install Playwright browser
        run: npx --yes playwright@1.62.1 install --with-deps chromium
      - name: Run Copier update golden path
        run: uv run pytest tests/test_copier_update_golden_path.py
