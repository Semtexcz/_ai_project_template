_min_copier_version: "9.7.0"
_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml
_exclude:
  - "{% if project_type not in ['backend', 'fullstack'] %}/backend{% endif %}"
  - "{% if project_type not in ['backend', 'fullstack'] %}/backend/**{% endif %}"
  - "{% if project_type not in ['frontend', 'fullstack'] %}/frontend{% endif %}"
  - "{% if project_type not in ['frontend', 'fullstack'] %}/frontend/**{% endif %}"
  - "{% if project_type not in ['script', 'library'] %}/src{% endif %}"
  - "{% if project_type not in ['script', 'library'] %}/src/**{% endif %}"
  - "{% if project_type not in ['script', 'library'] %}/tests{% endif %}"
  - "{% if project_type not in ['script', 'library'] %}/tests/**{% endif %}"
  - "{% if project_type in ['script', 'library', 'backend'] %}nuxt.config.ts{% endif %}"
  - "{% if project_type in ['script', 'library', 'backend'] %}/frontend/**{% endif %}"
  - "{% if project_type != 'fullstack' %}/compose.yaml{% endif %}"
  - "{% if not include_reference_feature %}/examples{% endif %}"
  - "{% if runtime_level == 'local' %}/.github/workflows{% endif %}"
  - "{% if runtime_level == 'local' %}/.github/workflows/**{% endif %}"
  - "{% if not include_reference_feature %}/examples/**{% endif %}"
_skip_if_exists:
  - docs/product.md
  - project/brief.md
  - project/roadmap.md
  - project/requirements.md
  - project/tasks/*.md
  - docs/decisions/*.md
  - README.md
  - AGENTS.md
  - CHANGELOG.md

project_name:
  type: str
  help: Human-readable project name.
  default: Golden Path App

project_slug:
  type: str
  help: Repository/package slug.
  default: "{{ project_name|lower|replace(' ', '-')|replace('_', '-') }}"

python_package:
  type: str
  help: Python import package name.
  default: "{{ project_slug|replace('-', '_') }}"

project_type:
  type: str
  help: Select the primary project type.
  choices:
    Script: script
    Library: library
    Backend: backend
    Frontend: frontend
    Full-stack: fullstack
  default: script

runtime_level:
  type: str
  help: Select the intended operational level.
  choices:
    Local: local
    Shared: shared
    Production: production
  default: local

preset:
  type: str
  help: Optional convenience preset. The axes above remain authoritative.
  choices:
    None: none
    Production full-stack: production-fullstack
    Production backend: production-backend
    Shared library: shared-library
  default: none

include_reference_feature:
  type: bool
  help: Include the full-stack reference feature under examples/.
  default: false

template_version:
  type: str
  help: Template version recorded in generated projects.
  default: "0.1.0"
